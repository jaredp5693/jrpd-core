[package]
name = "jrpd-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Jared James Peronek"]
description = "Deterministic cryptographic wire framing, IEEE-754 GRS downcasting, sandboxed Stack VM, and BIP-340 M-of-N quorum engine."
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "nostr", "ieee754", "vm", "protocol"]
categories = ["cryptography", "network-programming", "no-std"]

[lib]
name = "jrpd_core"
crate-type = ["rlib", "staticlib"]

[features]
default = ["std", "os-hardening"]
std = []
os-hardening = ["dep:libc"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
sha2 = { version = "0.10.8", default-features = false }
k256 = { version = "0.13.3", default-features = false, features = ["schnorr", "sha256", "ecdh"] }
zeroize = { version = "1.8.1", default-features = false, features = ["derive"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
libc = { version = "0.2.155", optional = true }

[build-dependencies]
cc = "1.0.98"

[dev-dependencies]
rand_chacha = "0.3.1"
rand_core = "0.6.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.test]
panic = "unwind"
